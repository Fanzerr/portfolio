{{- if .Values.fleet.automigration }}
apiVersion: batch/v1
kind: Job
metadata:
  labels:
  name: fleet-{{ .Release.Name }}-migration
  namespace: {{ .Release.Namespace }}
spec:
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app: fleet
        release: {{ .Release.Name }}
        {{- with .Values.global.labels }}
        {{- toYaml . | trim | nindent 8 }}
        {{- end }}
        {{- with .Values.fleet.deployment.labels }}
        {{- toYaml . | trim | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      shareProcessNamespace: true
      containers:
      - name: fleet-migration
        command: ["/bin/sh", "-c"]
        args:
          - /usr/bin/fleet prepare db --no-prompt
        image: {{ .Values.fleet.deployment.image }}
        imagePullPolicy: {{ .Values.fleet.deployment.imagePullPolicy }}
        resources:
          limits:
            cpu: 1
            memory: 4Gi
          requests:
            cpu: 0.1
            memory: 50Mi
        env:
          - name: FLEET_SERVER_ADDRESS
            value: "0.0.0.0:8080"
          - name: FLEET_AUTH_BCRYPT_COST
            value: "12"
          - name: FLEET_AUTH_SALT_KEY_SIZE
            value: "24"
          - name: FLEET_APP_TOKEN_KEY_SIZE
            value: "24"
          - name: FLEET_APP_TOKEN_VALIDITY_PERIOD
            value: "120h"
          - name: FLEET_SESSION_KEY_SIZE
            value: "64"
          - name: FLEET_SESSION_DURATION
            value: "2160h"
          - name: FLEET_LOGGING_DEBUG
            value: "false"
          - name: FLEET_LOGGING_JSON
            value: "false"
          - name: FLEET_LOGGING_DISABLE_BANNER
            value: "false"
          - name: FLEET_SERVER_TLS
            value: "false"
          ## END FLEET SECTION
          ## BEGIN MYSQL SECTION
          - name: FLEET_MYSQL_ADDRESS
            value: {{ .Release.Name }}-mysql:3306
          - name: FLEET_MYSQL_DATABASE
            value: fleet
          - name: FLEET_MYSQL_USERNAME
            value: fleet
          - name: FLEET_MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                key: mysql-password
                name: fleet-password
          - name: FLEET_MYSQL_MAX_OPEN_CONNS
            value: "50"
          - name: FLEET_MYSQL_MAX_IDLE_CONNS
            value: "50"
          - name: FLEET_MYSQL_CONN_MAX_LIFETIME
            value: "0"
          ## END MYSQL SECTION
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 3333
          runAsUser: 3333
          runAsNonRoot: true
      serviceAccountName: fleet
{{- end }}
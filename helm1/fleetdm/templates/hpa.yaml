{{- if .Values.fleet.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}
  minReplicas: {{ .Values.fleet.hpa.minReplicas }}
  maxReplicas: {{ .Values.fleet.hpa.maxReplicas }}
  metrics:
  {{- if .Values.fleet.hpa.cpuUtilization }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.fleet.hpa.cpuUtilization }}
  {{- end }}
  {{- if .Values.fleet.hpa.memoryValue }}
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: {{ .Values.fleet.hpa.memoryValue }}
  {{- end }}
{{- end }}

{{- if .Values.fleet.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    {{- with .Values.global.annotations }}
    {{- toYaml . | trim | nindent 4 }}
    {{- end }}
    {{- with .Values.fleet.ingress.annotations }}
    {{- toYaml . | trim | nindent 4 }}
    {{- end }}
  labels:
    app: fleet
    release: {{ .Release.Name }}
    {{- with .Values.global.labels }}
    {{- toYaml . | trim | nindent 4 }}
    {{- end }}
    {{- with .Values.fleet.ingress.labels }}
    {{- toYaml . | trim | nindent 4 }}
    {{- end }}
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.fleet.ingress.ingressClassName }}
  rules:
  - host: {{ .Values.fleet.ingress.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ .Release.Name}}-service
            port:
              number: 8080
        path: /
        pathType: ImplementationSpecific
  {{- if .Values.fleet.ingress.tls.enabled }}
  tls:
  - hosts:
      - {{ .Values.fleet.ingress.host }}
    secretName: {{ .Release.Name }}-tls
  {{- end }}
{{- end }}